# Redis działa wyłącznie w prywatnej sieci Compose i nie ma portu na hoście.
bind 0.0.0.0
protected-mode no
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

daemonize no
supervised no
loglevel notice
logfile ""

databases 16
dir /data
dbfilename dump.rdb

# Dwie niezależne formy trwałości ograniczają ryzyko utraty nauczonego Bayesa.
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes

appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Bayes nie może po cichu tracić starszych danych wskutek eksmisji kluczy.
maxmemory 128mb
maxmemory-policy noeviction

# Polecenia destrukcyjne nie są potrzebne aplikacji.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""
