# Ten plik jest dołączany po bezpiecznej konfiguracji bazowej obrazu Unbound.
# Resolver jest dostępny tylko w prywatnej sieci Compose.
server:
    do-ip6: no
    prefer-ip6: no
    hide-identity: yes
    hide-version: yes
    qname-minimisation: yes
    aggressive-nsec: yes
    harden-below-nxdomain: yes
    harden-referral-path: no
    minimal-responses: yes
    prefetch: yes
    prefetch-key: yes
    serve-expired: yes
    serve-expired-ttl: 86400
    cache-min-ttl: 60
    cache-max-ttl: 86400
    edns-buffer-size: 1232
    num-threads: 1
    msg-cache-size: 32m
    rrset-cache-size: 64m
    access-control: 192.0.2.0/24 allow
