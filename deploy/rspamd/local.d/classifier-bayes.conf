# Uczenie następuje wyłącznie po ręcznym przeniesieniu wiadomości do folderu
# AI-Naucz-spam lub AI-Naucz-wazne. Automatyczne uczenie jest celowo wyłączone.
backend = "redis";
new_schema = true;
min_learns = 200;
autolearn = false;

# Mniej znaczące tokeny wygasają po około 100 dniach; ważne tokeny są
# zachowywane przez moduł bayes_expiry.
expire = 8640000;
