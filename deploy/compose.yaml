name: o2-mail-guardian

x-logowanie: &logowanie
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  unbound:
    image: klutchell/unbound:1.25.2@sha256:f5cf9592d516969dc652f2b44f582f885cec047f9daee539881e0392aa6f29e6
    container_name: o2-mail-guardian-unbound
    restart: unless-stopped
    networks:
      guardian:
        ipv4_address: 192.0.2.53
    volumes:
      - ./unbound/unbound.conf:/etc/unbound/custom.conf.d/guardian.conf:ro
      - unbound_state:/var/unbound
    healthcheck:
      test: ["CMD", "drill-hc", "@127.0.0.1", "dnssec.works"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 20s
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 64
    logging: *logowanie

  redis:
    image: redis:7.4.9-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: o2-mail-guardian-redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    networks:
      - guardian
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 96
    logging: *logowanie

  rspamd:
    image: rspamd/rspamd:4.1.2@sha256:15dfe447f8913516c4ff24933a0727aff53d88bf38ef1937fb74f5152568f496
    container_name: o2-mail-guardian-rspamd
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      unbound:
        condition: service_healthy
    environment:
      RSPAMD_LOCAL_ADDR: "*"
      RSPAMD_LOG_TYPE: console
    networks:
      - guardian
    ports:
      - "127.0.0.1:11333:11333"
      - "127.0.0.1:11334:11334"
    volumes:
      - ./rspamd/local.d/classifier-bayes.conf:/etc/rspamd/local.d/classifier-bayes.conf:ro
      - ./rspamd/local.d/fuzzy_check.conf:/etc/rspamd/local.d/fuzzy_check.conf:ro
      - ./rspamd/local.d/logging.inc:/etc/rspamd/local.d/logging.inc:ro
      - ./rspamd/local.d/neural.conf:/etc/rspamd/local.d/neural.conf:ro
      - ./rspamd/local.d/options.inc:/etc/rspamd/local.d/options.inc:ro
      - ./rspamd/local.d/redis.conf:/etc/rspamd/local.d/redis.conf:ro
      - ./rspamd/local.d/url_redirector.conf:/etc/rspamd/local.d/url_redirector.conf:ro
      - ${GUARDIAN_RUNTIME_DIR:?Uruchom scripts/02-uruchom-silnik.command}/rspamd/worker-controller.inc:/etc/rspamd/local.d/worker-controller.inc:ro
      - rspamd_data:/var/lib/rspamd
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /run:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    cpus: 1.25
    pids_limit: 256
    logging: *logowanie

networks:
  guardian:
    name: o2-mail-guardian
    driver: bridge
    ipam:
      config:
        - subnet: 192.0.2.0/24

volumes:
  redis_data:
    name: o2-mail-guardian-redis
  rspamd_data:
    name: o2-mail-guardian-rspamd
  unbound_state:
    name: o2-mail-guardian-unbound
