name: Guardian checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'

permissions:
  contents: read

concurrency:
  group: guardian-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS tests and installer
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Full checks, vulnerability scan and isolated installer tests
        run: make check
      - name: Build distributable package
        run: make package
      - name: Preserve tested package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: guardian-macos-arm64
          path: dist/*
          if-no-files-found: error
          retention-days: 14
